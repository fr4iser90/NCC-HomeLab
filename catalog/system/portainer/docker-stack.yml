# Docker Swarm Stack für Portainer
# Deploy: docker stack deploy -c docker-stack.yml system-portainer
#
# SECURITY: Docker socket = high risk. Traefik/DNS exposure is OFF by default.
# Prefer VPN/LAN access. Enable Traefik labels only with Auth + admin-whitelist.

version: '3.8'

services:
  portainer:
    image: portainer/portainer-ce:latest
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    networks:
      - proxy
    dns:
      - 1.1.1.1
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - portainer-data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "traefik.enable=false"
        - "traefik.docker.network=proxy"
        # VPN/LAN only — uncomment together with traefik.enable=true:
        # - "traefik.http.routers.portainer.entrypoints=websecure"
        # - "traefik.http.routers.portainer.rule=Host(`portainer.${DOMAIN}`)"
        # - "traefik.http.routers.portainer.tls=true"
        # - "traefik.http.routers.portainer.tls.certresolver=http_resolver"
        # - "traefik.http.services.portainer.loadbalancer.server.port=9000"
        # - "traefik.http.routers.portainer.middlewares=default@file,traefikAuth@file,admin-whitelist@file"

volumes:
  portainer-data:
    driver: local

networks:
  proxy:
    external: true
