# Ollama — LLM runtime (ARM / aarch64, e.g. Jetson Orin).
# GPU via CDI: devices nvidia.com/gpu=all (jetpack-nixos / NVIDIA CDI).
# Ensure network: docker network create ai-net
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./models:/models
    environment:
      - OLLAMA_HOST=0.0.0.0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - GGML_CUDA=1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    networks:
      - ai-net
    devices:
      - nvidia.com/gpu=all
    dns:
      - 1.1.1.1
      - 8.8.8.8

volumes:
  ollama_data:

networks:
  ai-net:
    external: true
