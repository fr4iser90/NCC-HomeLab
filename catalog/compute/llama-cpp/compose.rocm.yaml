services:
  llama:
    build:
      context: .
      dockerfile: Dockerfile.rocm
    container_name: llama-rocm
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    ipc: host
    shm_size: "16gb"
    environment:
      HSA_OVERRIDE_GFX_VERSION: "11.5.1"
      LD_LIBRARY_PATH: /app
    volumes:
      - ./models:/models
      - ./models.ini:/etc/llama-cpp/models.ini:ro
    ports:
      - "11535:8080"
    command:
      [
        "/app/llama-server",
        "--host", "0.0.0.0",
        "--port", "8080",
        "--models-preset", "/etc/llama-cpp/models.ini",
        "--models-max", "1"
      ]
    restart: unless-stopped

  llama-embeddings:
    build:
      context: .
      dockerfile: Dockerfile.rocm
    container_name: llama-embeddings-rocm
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    ipc: host
    shm_size: "2gb"
    environment:
      HSA_OVERRIDE_GFX_VERSION: "11.5.1"
      LD_LIBRARY_PATH: /app
    volumes:
      - ./models:/models
      - ./models-embeddings.ini:/etc/llama-cpp/models-embeddings.ini:ro
    ports:
      - "11536:8080"
    command:
      [
        "/app/llama-server",
        "--host", "0.0.0.0",
        "--port", "8080",
        "--models-preset", "/etc/llama-cpp/models-embeddings.ini",
        "--models-max", "1"
      ]
    restart: unless-stopped
