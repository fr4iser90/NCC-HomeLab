events {}

http {

  client_max_body_size 25m;

  # Echte Client-IP von Traefik übernehmen
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 192.168.0.0/16;

  # Logging erweitern
  log_format detailed
  '$remote_addr '
  '$http_x_forwarded_for '
  '$host '
  '"$request" '
  '$status '
  '"$http_user_agent"';

  access_log /var/log/nginx/access.log detailed;

  upstream llama_backend {
    server ${LLM_BACKEND};
  }

  upstream vllama_backend {
    server ${VLM_BACKEND};
  }

  upstream embed_backend {
    server ${EMBED_BACKEND};
  }

  upstream stt_backend {
    server ${STT_BACKEND};
  }

  upstream tts_backend {
    server ${TTS_BACKEND};
  }

  upstream ollama_backend {
    server ${OLLAMA_BACKEND};
  }

  upstream temp_guard {
    server temp-guard:8080;
  }

  # =========================
  # TEMPERATURE GUARD
  # =========================
  # Each server asks this local service before proxying expensive requests.

  # =========================
  # API KEY AUTH (LLM)
  # =========================
  map $http_x_api_key $llm_auth {
    default 0;
    "${LLM_API_KEY}" 1;
  }

  map $http_x_api_key $vlm_auth {
    default 0;
    "${VLM_API_KEY}" 1;
  }

  # =========================
  # API KEY AUTH (OLLAMA)
  # =========================
  map $http_x_api_key $ollama_auth {
    default 0;
    "${OLLAMA_API_KEY}" 1;
  }

  # =========================
  # API KEY AUTH (EMBED)
  # =========================
  map $http_x_api_key $embed_auth {
    default 0;
    "${EMBED_API_KEY}" 1;
  }

  # =========================
  # API KEY AUTH (STT)
  # =========================
  map $http_x_api_key $stt_auth {
    default 0;
    "${STT_API_KEY}" 1;
  }

  # =========================
  # API KEY AUTH (TTS)
  # =========================
  map $http_x_api_key $tts_auth {
    default 0;
    "${TTS_API_KEY}" 1;
  }

  # =========================
  # COMMON PROXY HEADERS (optional DRY improvement)
  # =========================
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # =========================
  # LLM SERVER (Ollama backend)
  # =========================
  server {
    listen 80;
    server_name ollama.${DOMAIN};

    if ($ollama_auth = 0) { return 403; }

    location = /_temp_check {
      internal;
      proxy_pass http://temp_guard/check;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URI $request_uri;
    }

    location @too_hot {
      internal;
      default_type application/json;
      return 503 '{"error":"blocked","reason":"local_temperature_above_limit"}';
    }

    location / {
      auth_request /_temp_check;
      error_page 403 = @too_hot;
      proxy_pass http://ollama_backend;
      proxy_buffering off;
      proxy_read_timeout 3600;
    }
  }

  # =========================
  # LLM SERVER (LLAMA backend)
  # =========================
  server {
    listen 80;
    server_name llm.${DOMAIN};

    if ($llm_auth = 0) { return 403; }

    location = /_temp_check {
      internal;
      proxy_pass http://temp_guard/check;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URI $request_uri;
    }

    location @too_hot {
      internal;
      default_type application/json;
      return 503 '{"error":"blocked","reason":"local_temperature_above_limit"}';
    }

    location / {
      auth_request /_temp_check;
      error_page 403 = @too_hot;
      proxy_pass http://llama_backend;
      proxy_buffering off;
      proxy_read_timeout 3600;
    }
  }

  # =========================
  # LLM SERVER (LLAMA backend)
  # =========================
  server {
    listen 80;
    server_name vlm.${DOMAIN};

    if ($vlm_auth = 0) { return 403; }

    location = /_temp_check {
      internal;
      proxy_pass http://temp_guard/check;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URI $request_uri;
    }

    location @too_hot {
      internal;
      default_type application/json;
      return 503 '{"error":"blocked","reason":"local_temperature_above_limit"}';
    }

    location / {
      auth_request /_temp_check;
      error_page 403 = @too_hot;
      proxy_pass http://vllama_backend;
      proxy_buffering off;
      proxy_read_timeout 3600;
    }
  }


  # =========================
  # EMBEDDINGS SERVER
  # =========================
  server {
    listen 80;
    server_name embed-llm.${DOMAIN};

    if ($embed_auth = 0) { return 403; }

    location = /_temp_check {
      internal;
      proxy_pass http://temp_guard/check;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URI $request_uri;
    }

    location @too_hot {
      internal;
      default_type application/json;
      return 503 '{"error":"blocked","reason":"local_temperature_above_limit"}';
    }

    location /v1/embeddings {
      auth_request /_temp_check;
      error_page 403 = @too_hot;
      proxy_pass http://embed_backend;
    }

    location /v1/models {
      auth_request /_temp_check;
      error_page 403 = @too_hot;
      proxy_pass http://embed_backend;
    }

    location / {
      return 404;
    }
  }

  # =========================
  # STT SERVER (Whisper)
  # =========================
  server {
    listen 80;
    server_name stt.${DOMAIN};

    if ($stt_auth = 0) { return 403; }

    location = /_temp_check {
      internal;
      proxy_pass http://temp_guard/check;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URI $request_uri;
    }

    location @too_hot {
      internal;
      default_type application/json;
      return 503 '{"error":"blocked","reason":"local_temperature_above_limit"}';
    }

    location / {
      auth_request /_temp_check;
      error_page 403 = @too_hot;
      proxy_pass http://stt_backend;
      proxy_buffering off;
      proxy_read_timeout 3600;
    }
  }

  # =========================
  # TTS SERVER (Piper)
  # =========================
  server {
    listen 80;
    server_name tts.${DOMAIN};

    if ($tts_auth = 0) { return 403; }

    location = /_temp_check {
      internal;
      proxy_pass http://temp_guard/check;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URI $request_uri;
    }

    location @too_hot {
      internal;
      default_type application/json;
      return 503 '{"error":"blocked","reason":"local_temperature_above_limit"}';
    }

    location / {
      auth_request /_temp_check;
      error_page 403 = @too_hot;
      proxy_pass http://tts_backend;
      proxy_buffering off;
      proxy_read_timeout 3600;
    }
  }
}
